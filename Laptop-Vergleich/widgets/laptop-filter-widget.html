<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiver Laptop-Filter</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #1e293b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: var(--text);
      line-height: 1.5;
    }

    .widget-shell {
      border: 1px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 12px;
      background: #ffffff;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .widget-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--secondary);
    }

    .widget-sub {
      margin: 4px 0 0 0;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .reset-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--secondary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .reset-btn:hover {
      background: #eef2ff;
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .filter-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .filter-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--secondary);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .filter-chip:hover {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
    }

    .budget-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .budget-row label {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--secondary);
    }

    .budget-row input[type="range"] {
      flex: 1;
      min-width: 180px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .budget-value {
      font-weight: 700;
      color: var(--primary-dark);
      background: #eef2ff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      min-width: 96px;
      text-align: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #312e81;
    }

    .status-bar.empty {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .status-bar.exact {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .match-card {
      border: 1px solid var(--border);
      border-top: 3px solid var(--success);
      border-radius: 10px;
      padding: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .rank-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      background: #eef2ff;
      color: #3730a3;
      display: inline-block;
      margin-bottom: 4px;
    }

    .match-card h4 {
      margin: 0;
      font-size: 0.96rem;
      color: var(--secondary);
    }

    .price-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: #065f46;
      background: #d1fae5;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .match-specs {
      font-size: 0.83rem;
      color: #475569;
      margin: 2px 0;
    }

    .match-link {
      display: inline-block;
      margin-top: auto;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    .match-link:hover {
      background: var(--primary-dark);
    }

    .excluded-wrap {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #cbd5e1;
    }

    .excluded-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .excluded-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .excluded-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      opacity: 0.82;
      font-size: 0.84rem;
    }

    .excluded-name {
      color: #64748b;
      text-decoration: line-through;
      font-weight: 600;
    }

    .reason-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .reason-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="widget-header">
      <div>
        <h3 class="widget-title">Interaktiver Laptop-Filter (7 verglichene Modelle)</h3>
        <p class="widget-sub">Aktiviere beliebig viele Kriterien &ndash; unpassende Laptops fallen sofort weg und zeigen den genauen Grund.</p>
      </div>
      <button type="button" class="reset-btn" id="resetBtn">Alle Filter zur&uuml;cksetzen</button>
    </div>

    <div class="filter-section">
      <div class="filter-label">Suchkriterien ausw&auml;hlen (Mehrfachauswahl)</div>
      <div class="chip-grid" id="chipGrid"></div>

      <div class="budget-row">
        <label for="budgetSlider">Maximales Budget:</label>
        <input type="range" id="budgetSlider" min="450" max="750" step="50" value="750">
        <span class="budget-value" id="budgetDisplay">bis 750 &euro;</span>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>
    <div class="results-grid" id="resultsGrid"></div>

    <div class="excluded-wrap" id="excludedWrap" style="display:none;">
      <div class="excluded-title">Ausgeschiedene Modelle &amp; Gr&uuml;nde</div>
      <div class="excluded-list" id="excludedList"></div>
    </div>
  </div>

  <script>
    const LAPTOPS = [
      {
        rank: 1,
        rating: "5/5",
        name: "Lenovo IdeaPad Slim 3 (15ARP10)",
        seller: "Cyberport (Fachhändler)",
        price: 599,
        priceLabel: "ca. 599 €",
        specs: "AMD Ryzen 7 170 (8 Kerne) · 16 GB DDR5 · 512 GB SSD · 15,3\" 16:10 IPS · Wi-Fi 7 · Win 11 Home",
        url: "https://www.cyberport.de/notebook-und-tablet/notebooks/lenovo/pdp/1c31-483/lenovo-ideapad-slim-3-15arp10-15-3-zoll-laptop-amd-ryzen-7-170-16-gb-ram-512-gb-ssd-windows-11-home-cosmic-blue.html",
        ram16: true,
        strongCpu: true,
        directRetailer: true,
        ratio1610: true,
        screen16: false,
        cleanLicense: true,
        wifi7: true
      },
      {
        rank: 2,
        rating: "4,5/5",
        name: "ASUS Vivobook 16 (16 GB + Win 11)",
        seller: "Fachhandel (Cyberport / NBB)",
        price: 640,
        priceLabel: "ca. 580–700 €",
        specs: "Core i5 / Core 5 oder Ryzen 5/7 · 16 GB RAM · 512 GB SSD · 16\" 16:10 IPS · Win 11 Home",
        url: "https://www.idealo.de/preisvergleich/ProductCategory/3751.html?q=ASUS+Vivobook+16+16GB+512GB+Windows+11",
        ram16: true,
        strongCpu: true,
        directRetailer: true,
        ratio1610: true,
        screen16: true,
        cleanLicense: true,
        wifi7: false
      },
      {
        rank: 3,
        rating: "4/5",
        name: "Dell Inspiron 15 (3530 / 3535)",
        seller: "Dell Store / Fachhandel",
        price: 650,
        priceLabel: "ca. 600–700 €",
        specs: "Core i5 oder Ryzen 5/7 · 16 GB RAM · 512 GB SSD · 15,6\" 16:9 IPS · Win 11",
        url: "https://www.idealo.de/preisvergleich/ProductCategory/3751.html?q=Dell+Inspiron+15+16GB+512GB+Windows+11",
        ram16: true,
        strongCpu: true,
        directRetailer: true,
        ratio1610: false,
        screen16: false,
        cleanLicense: true,
        wifi7: false
      },
      {
        rank: 4,
        rating: "3,5/5",
        name: "Acer Exo 15 / Extensa 15 + Office 2024",
        seller: "MediaMarkt Marketplace (Laptopia Shop)",
        price: 599,
        priceLabel: "599 €",
        specs: "AMD Ryzen 7 7730U (8 Kerne) · 16 GB RAM · 512 GB SSD · 15,6\" 16:9 FHD · Win 11 Pro",
        url: "https://www.mediamarkt.de/de/product/_acer-exo-15-ms-office-2024-pro-dauerversion-notebook-mit-156-zoll-display-amd-ryzentm-77730u-prozessor-16-gb-ram-512-gb-ssd-amd-radeontm-onboard-graphics-silber-windows-11-pro-184411065.html",
        ram16: true,
        strongCpu: true,
        directRetailer: false,
        ratio1610: false,
        screen16: false,
        cleanLicense: false,
        wifi7: false
      },
      {
        rank: 5,
        rating: "3/5",
        name: "HP OmniBook 3 16 (16-bu0750ngx)",
        seller: "HP Store direkt",
        price: 599,
        priceLabel: "~599 € (Sale)",
        specs: "Intel Core 5 320 (6 Kerne) · nur 8 GB DDR5 · 512 GB SSD · 16\" 16:10 IPS · Win 11 Home",
        url: "https://www.hp.com/de-de/shop/products/laptops/hp-omnibook-3-laptop-16-bu0750ngx-e40q3ea-abd",
        ram16: false,
        strongCpu: true,
        directRetailer: true,
        ratio1610: true,
        screen16: true,
        cleanLicense: true,
        wifi7: false
      },
      {
        rank: 6,
        rating: "3/5",
        name: "Lenovo 15,6\" (Ryzen 5 7520U)",
        seller: "MediaMarkt Marketplace (cybernerds)",
        price: 549,
        priceLabel: "549 €",
        specs: "AMD Ryzen 5 7520U (4 Zen-2-Kerne) · 16 GB RAM · 512 GB SSD · 15,6\" 16:9 FHD · Win 11 Home",
        url: "https://www.mediamarkt.de/de/product/_lenovo-or-156-or-ryzen-5-or-8-x-440-ghz-or-notebook-mit-156-zoll-display-amd-ryzentm-57520u-prozessor-16-gb-ram-512-gb-ssd-amd-radeontm-610m-schwarz-windows-11-home-64-bit-147257816.html",
        ram16: true,
        strongCpu: false,
        directRetailer: false,
        ratio1610: false,
        screen16: false,
        cleanLicense: true,
        wifi7: false
      },
      {
        rank: 7,
        rating: "2/5",
        name: "Lenovo 15,6\" (Intel Celeron N5100)",
        seller: "Amazon Marketplace (z. B. shinobee)",
        price: 450,
        priceLabel: "ca. 400–450 €",
        specs: "Intel Celeron N5100 (4 schwache Kerne) · 16 GB RAM · 512 GB SSD · 15,6\" 16:9 FHD · Win 11 Pro",
        url: "https://www.amazon.de/dp/B0CXQ5XM3X",
        ram16: true,
        strongCpu: false,
        directRetailer: false,
        ratio1610: false,
        screen16: false,
        cleanLicense: true,
        wifi7: false
      }
    ];

    const FILTERS = [
      { key: "ram16", label: "Mind. 16 GB RAM", failText: "Nur 8 GB RAM" },
      { key: "strongCpu", label: "Zukunftssichere CPU (≥ 6 Kerne)", failText: "Schwache 4-Kern-CPU" },
      { key: "directRetailer", label: "Kein Marketplace (nur Fachhändler/Hersteller)", failText: "Marketplace-Drittanbieter" },
      { key: "ratio1610", label: "16:10-Display (mehr Zeilen)", failText: "Nur 16:9-Format" },
      { key: "screen16", label: "Großes 16-Zoll-Display", failText: "Kleiner als 16 Zoll" },
      { key: "cleanLicense", label: "Kein Volumenlizenz-Risiko", failText: "Volumenlizenz-Risiko" },
      { key: "wifi7", label: "Wi-Fi 7 & USB-C (PD/DP)", failText: "Kein Wi-Fi 7" }
    ];

    const activeKeys = new Set();
    let maxBudget = 750;

    const chipGrid = document.getElementById("chipGrid");
    const budgetSlider = document.getElementById("budgetSlider");
    const budgetDisplay = document.getElementById("budgetDisplay");
    const statusBar = document.getElementById("statusBar");
    const resultsGrid = document.getElementById("resultsGrid");
    const excludedWrap = document.getElementById("excludedWrap");
    const excludedList = document.getElementById("excludedList");
    const resetBtn = document.getElementById("resetBtn");

    function buildChips() {
      chipGrid.innerHTML = "";
      FILTERS.forEach((f) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-chip" + (activeKeys.has(f.key) ? " active" : "");
        btn.textContent = (activeKeys.has(f.key) ? "✓ " : "+ ") + f.label;
        btn.addEventListener("click", () => {
          if (activeKeys.has(f.key)) activeKeys.delete(f.key);
          else activeKeys.add(f.key);
          buildChips();
          render();
        });
        chipGrid.appendChild(btn);
      });
    }

    function render() {
      const matched = [];
      const excluded = [];

      LAPTOPS.forEach((item) => {
        const reasons = [];
        FILTERS.forEach((f) => {
          if (activeKeys.has(f.key) && !item[f.key]) {
            reasons.push(f.failText);
          }
        });
        if (item.price > maxBudget) {
          reasons.push("Über Budget (" + item.priceLabel + ")");
        }
        if (reasons.length === 0) matched.push(item);
        else excluded.push({ item, reasons });
      });

      const activeCount = activeKeys.size + (maxBudget < 750 ? 1 : 0);
      statusBar.className = "status-bar" + (matched.length === 0 ? " empty" : (matched.length === 1 ? " exact" : ""));
      statusBar.innerHTML =
        "<span>" + matched.length + " von " + LAPTOPS.length + " Laptops erfüllen alle gewählten Kriterien</span>" +
        "<span style='font-size:0.8rem; opacity:0.85;'>Aktive Filter: " + activeCount + "</span>";

      resultsGrid.innerHTML = "";
      if (matched.length === 0) {
        resultsGrid.innerHTML =
          "<div style='grid-column:1/-1; padding:16px; border-radius:8px; background:#fef2f2; color:#991b1b; font-size:0.9rem;'>" +
          "Keiner der 7 Laptops erfüllt diese Kombination gleichzeitig. Deaktiviere ein Kriterium oder erhöhe das Budget." +
          "</div>";
      } else {
        matched.forEach((m) => {
          const card = document.createElement("div");
          card.className = "match-card";
          card.innerHTML =
            "<div class='match-top'>" +
              "<div>" +
                "<span class='rank-tag'>Platz " + m.rank + " · " + m.rating + "</span>" +
                "<h4>" + m.name + "</h4>" +
              "</div>" +
              "<span class='price-pill'>" + m.priceLabel + "</span>" +
            "</div>" +
            "<div class='match-specs'><strong>Händler:</strong> " + m.seller + "</div>" +
            "<div class='match-specs'>" + m.specs + "</div>" +
            "<a class='match-link' href='" + m.url + "' target='_blank' rel='noopener noreferrer'>Zum Angebot &rarr;</a>";
          resultsGrid.appendChild(card);
        });
      }

      if (excluded.length > 0) {
        excludedWrap.style.display = "block";
        excludedList.innerHTML = "";
        excluded.forEach(({ item, reasons }) => {
          const row = document.createElement("div");
          row.className = "excluded-item";
          const badges = reasons.map((r) => "<span class='reason-badge'>&times; " + r + "</span>").join("");
          row.innerHTML =
            "<span class='excluded-name'>Platz " + item.rank + ": " + item.name + "</span>" +
            "<div class='reason-badges'>" + badges + "</div>";
          excludedList.appendChild(row);
        });
      } else {
        excludedWrap.style.display = "none";
      }

      sendHeight();
    }

    budgetSlider.addEventListener("input", () => {
      maxBudget = parseInt(budgetSlider.value, 10);
      budgetDisplay.textContent = "bis " + maxBudget + " €";
      render();
    });

    resetBtn.addEventListener("click", () => {
      activeKeys.clear();
      maxBudget = 750;
      budgetSlider.value = "750";
      budgetDisplay.textContent = "bis 750 €";
      buildChips();
      render();
    });

    function sendHeight() {
      const height = document.documentElement.scrollHeight;
      window.parent.postMessage({
        iframeHeight: height,
        frameHeight: height,
        height: height,
        type: "resize-iframe",
        src: window.location.pathname
      }, "*");
    }

    window.addEventListener("load", sendHeight);
    window.addEventListener("resize", sendHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    }

    buildChips();
    render();
  </script>
</body>
</html>
